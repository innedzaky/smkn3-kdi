name: Build and Deploy Next.js App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build

      - name: Bundle Standalone Build
        run: |
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static
          tar -czf standalone-build.tar.gz -C .next/standalone .

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: standalone-build
          path: standalone-build.tar.gz
          retention-days: 7

      # -------------------------------------------------------------
      # LANGKAH BARU: MEMANGGIL SECRET FTP UNTUK DEPLOY KE HOSTING
      # -------------------------------------------------------------
      - name: 🚀 Deploy Standalone Build to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # server-dir: ./public_html/  # Path ke folder website di hosting (hapus '#' jika beda folder)