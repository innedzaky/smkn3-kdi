name: Build and Deploy Next.js App

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build

      - name: Prepare Standalone Build
        run: |
          mkdir -p .next/standalone/.next
          rm -rf .next/standalone/public
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static
          cp package.json .next/standalone/package.json

          # sharp's native binary is split into separate optional packages
          # (e.g. @img/sharp-linux-x64) that are required dynamically at
          # runtime. Next.js's output file tracing can't follow that dynamic
          # require, so the standalone build silently drops it unless we
          # copy it in ourselves.
          mkdir -p .next/standalone/node_modules
          cp -r node_modules/sharp .next/standalone/node_modules/sharp
          cp -r node_modules/@img .next/standalone/node_modules/@img

      - name: Deploy to IDCloudHost via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}

          protocol: ftp
          port: 21

          local-dir: .next/standalone/
          server-dir: /smkn3-kdi/

          dangerous-clean-slate: false

          exclude: |
            **/.git*
            **/.github/**
            **/.next/cache/**
            **/.next/types/**
            README.md
            tsconfig.json
            next-env.d.ts
